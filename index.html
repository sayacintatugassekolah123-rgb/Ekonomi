<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Ujian Ekonomi</title>
<style>
:root{--bg:#eef0ff;--card:rgba(255,255,255,.72);--tx:#1f2328;--mu:#6b6b66;--bd:rgba(120,120,170,.25);--ac:#5b4bdb;--sel:rgba(91,75,219,.12);--ok:#1a7f37;--no:#c62828;--okb:#e4f4e8;--nob:#fbe7e7;--wa:#d98400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1f;--card:rgba(32,34,60,.66);--tx:#ebe9e4;--mu:#a3a099;--bd:rgba(160,160,230,.22);--ac:#7766f0;--sel:rgba(119,102,240,.22);--ok:#5fd07a;--no:#ff7b7b;--okb:#1c3524;--nob:#3b2222;--wa:#f0b040}}
:root[data-theme="dark"]{--bg:#0e0f1f;--card:rgba(32,34,60,.66);--tx:#ebe9e4;--mu:#a3a099;--bd:rgba(160,160,230,.22);--ac:#7766f0;--sel:rgba(119,102,240,.22);--ok:#5fd07a;--no:#ff7b7b;--okb:#1c3524;--nob:#3b2222;--wa:#f0b040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.7rem;margin:.3em 0 .1em}h2{font-size:1.1rem;margin:20px 0 8px}
.mu{color:var(--mu)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);z-index:10;padding:10px 16px 8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top>div{max-width:640px;margin:0 auto}
.hr{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin-bottom:6px}
.warn{color:var(--no);animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#f472b6);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px}
.in{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateX(var(--dx,30px))}to{opacity:1;transform:none}}
.tag{font-size:.78rem;color:var(--mu);margin-bottom:8px}
.st{white-space:pre-line;font-size:1.04rem;font-weight:500}
.op{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin-top:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;font:inherit;cursor:pointer;transition:.15s}
.op b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.82rem}
.op.m b{border-radius:8px}
.op.on{border-color:var(--ac);background:var(--sel)}.op.on b{background:var(--ac);border-color:var(--ac);color:#fff}
.op:active{transform:scale(.98)}
.lg{font-size:.9rem;color:var(--mu);margin:12px 0 4px}
.jr{margin-top:14px}.jr p{margin:0 0 6px;font-weight:500}
.chips{display:flex;gap:8px}.chip{flex:1;max-width:64px;min-height:46px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--ac),#b05cf0);border-color:var(--ac);color:#fff}.btn.full{width:100%;margin-top:10px}
.btn:active{transform:scale(.97)}.btn.fl{border-color:var(--wa);color:var(--wa)}.btn.fl.on{background:var(--wa);color:#fff}
.nv{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:10;justify-content:center}
.nv .btn{padding:0 14px}.nv .pri{flex:1;max-width:200px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:40}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.grid button{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700}
.grid .a{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .f{border-color:var(--wa);box-shadow:inset 0 0 0 2px var(--wa)}.grid .c{outline:3px solid var(--tx);outline-offset:1px}
.lgd{font-size:.8rem;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;box-shadow:0 8px 30px rgba(91,75,219,.3);background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;margin:14px auto}
.ring span{background:var(--bg);width:116px;height:116px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;font-weight:800}
.bb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}.bb .bar{flex:1}.bb em{font-style:normal;width:42px;text-align:right}
details{border:1px solid var(--bd);border-radius:14px;margin:8px 0;background:var(--card)}
summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
details>div{padding:0 14px 14px;font-size:.93rem}
.ok{color:var(--ok)}.no{color:var(--no)}
.ans{padding:8px 10px;border-radius:10px;margin-top:8px}.ans.g{background:var(--okb)}.ans.r{background:var(--nob)}
.pick{display:block;width:100%;text-align:left;font:inherit;padding:14px;margin-top:10px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer}
.pick:active{transform:scale(.98)}.pick b{display:block}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.6;animation:fl 20s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#a5b4fc;top:-20%;left:-15%}
.bg i:nth-child(2){background:#f9a8d4;top:25%;right:-25%;animation-delay:-6s}
.bg i:nth-child(3){background:#6ee7b7;bottom:-25%;left:10%;animation-delay:-12s}
@keyframes fl{to{transform:translate(9vw,7vh) scale(1.18)}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg i{opacity:.32}}
:root[data-theme="dark"] .bg i{opacity:.32}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
.gt{background:linear-gradient(90deg,var(--ac),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.card,.op,.pick,details,.nv,.grid button,.chip,.btn:not(.pri){backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card,.pick,details{box-shadow:0 6px 24px rgba(60,50,130,.10)}
</style></head><body><div class="bg"><i></i><i></i><i></i></div><div id="app"></div>

{t:'s',l:'L2 · Sangat mudah',q:'Pendapatan nasional yang dihitung dengan menjumlahkan seluruh nilai tambah barang dan jasa dari berbagai sektor ekonomi disebut metode...',o:['Pendekatan pengeluaran','Pendekatan pendapatan','Pendekatan produksi','Pendekatan nilai pasar','Pendekatan distribusi'],a:2},

{t:'s',l:'L2 · Sedang',q:'Menurut Werner Sombart, ciri utama zaman kapitalisme madya (raya) adalah...',o:['Ekonomi subsisten dan pemenuhan kebutuhan sendiri.','Munculnya kaum pengusaha (borjuis) dan pasar bebas yang didorong persaingan laba.','Alat produksi dikuasai penuh negara.','Produksi manual tanpa sistem perbankan modern.','Hubungan antarmanusia didasarkan adat istiadat.'],a:1},

function shell(){app.innerHTML=`<div class="top"><div><div class="hr"><span id="no"></span><span id="tm">⏱ ${fm(T)}</span></div><div class="bar"><i id="pg"></i></div></div></div><div class="wrap" id="card"></div><div class="nv" id="nv"></div>`;
const c=$('#card');let x0=0;c.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});c.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)go(d<0?1:-1)})}
const isA=k=>{const a=A[k];return Q[k].t=='s'?a>=0:Q[k].t=='m'?a.length>0:a.some(v=>v>=0)};
function draw(dir){const q=Q[i];$('#no').textContent='Soal '+(i+1)+' / '+Q.length;
$('#pg').style.width=(Q.filter((_,k)=>isA(k)).length/Q.length*100)+'%';
let h=`<div class="card ${dir?'in':''}" style="--dx:${dir<0?'-30px':'30px'}"><div class="tag">${D[q.b].n} · ${{s:'Pilihan Ganda',m:'Pilih semua yang benar',j:'Menjodohkan'}[q.t]} · ${q.l}</div><div class="st">${esc(q.q)}</div>`;
if(q.t=='s')q.o.forEach((o,k)=>h+=`<button class="op ${A[i]==k?'on':''}" onclick="pick(${k})"><b>${L[k]}</b><span>${esc(o)}</span></button>`);
if(q.t=='m')q.o.forEach((o,k)=>h+=`<button class="op m ${A[i].includes(k)?'on':''}" onclick="pick(${k})"><b>${A[i].includes(k)?'✓':k+1}</b><span>${esc(o)}</span></button>`);
if(q.t=='j'){h+='<div class="lg">Pilihan jawaban:</div>'+q.o.map((o,k)=>`<div><b>${L[k]}.</b> ${esc(o)}</div>`).join('');
q.i.forEach((x,r)=>h+=`<div class="jr"><p>${r+1}. ${esc(x)}</p><div class="chips">${q.o.map((_,k)=>`<button class="chip ${A[i][r]==k?'on':''}" onclick="pick(${r},${k})">${L[k]}</button>`).join('')}</div></div>`)}
$('#card').innerHTML=h+'</div>';
const last=i==Q.length-1;
$('#nv').innerHTML=`<button class="btn" onclick="go(-1)" ${i?'':'disabled style="opacity:.4"'}>‹</button><button class="btn fl ${F[i]?'on':''}" onclick="flag()">⚑</button><button class="btn" onclick="sheet()">▦ ${Q.filter((_,k)=>isA(k)).length}/${Q.length}</button><button class="btn pri" onclick="${last?'sheet()':'go(1)'}">${last?'Selesai ✓':'Lanjut ›'}</button>`;
if(dir)scrollTo({top:0})}
function pick(a,b){const q=Q[i];if(q.t=='s')A[i]=a;else if(q.t=='m'){const s=A[i],p=s.indexOf(a);p<0?s.push(a):s.splice(p,1)}else A[i][a]=b;draw();navigator.vibrate?.(8)}
function go(d){const n=i+d;if(n<0||n>=Q.length)return;i=n;draw(d)}
function flag(){F[i]=F[i]?0:1;draw()}
function sheet(){document.querySelector('.sheet')?.remove();const un=Q.filter((_,k)=>!isA(k)).length,fl=F.filter(x=>x).length,s=document.createElement('div');s.className='sheet';
s.onclick=e=>{if(e.target==s)s.remove()};
s.innerHTML=`<div><b style="font-size:1.1rem">Daftar Soal</b><div class="grid">${Q.map((_,k)=>`<button class="${isA(k)?'a':''} ${F[k]?'f':''} ${k==i?'c':''}" onclick="i=${k};document.querySelector('.sheet').remove();draw(1)">${k+1}</button>`).join('')}</div>
<div class="lgd"><span>🟩 terjawab</span><span>🟧 ragu-ragu</span><span>⬜ kosong</span></div>
<p style="margin:12px 0 0">${un?`<span class="no">${un} soal belum dijawab.</span>`:'<span class="ok">Semua soal sudah dijawab.</span>'} ${fl?fl+' ditandai ragu-ragu.':''}</p>
<button class="btn pri full" onclick="finish()">Kumpulkan Ujian</button><button class="btn full" onclick="document.querySelector('.sheet').remove()">Kembali ke soal</button></div>`;document.body.append(s)}
const eq=(a,b)=>a.length==b.length&&a.every((x,k)=>x==b[k]);
const okQ=(q,a)=>q.t=='s'?a==q.a:q.t=='m'?eq([...a].sort(),q.a):eq(a,q.a);
const fa=(q,a)=>q.t=='s'?(a>=0?L[a]+'. '+esc(q.o[a]):'—'):q.t=='m'?(a.length?[...a].sort().map(x=>(x+1)+'. '+esc(q.o[x])).join('<br>'):'—'):q.i.map((x,r)=>(r+1)+'. '+esc(x)+' → '+(a[r]>=0?L[a[r]]+'. '+esc(q.o[a[r]]):'?')).join('<br>');
function finish(){clearInterval(tm);document.querySelector('.sheet')?.remove();const res=Q.map((q,k)=>okQ(q,A[k]));const c=res.filter(x=>x).length,p=Math.round(c/Q.length*100);
const bb=D.map((b,bi)=>{const ix=Q.map((q,k)=>q.b==bi?k:-1).filter(k=>k>=0);if(!ix.length)return'';const r=ix.filter(k=>res[k]).length,pc=r/ix.length*100;return`<div class="bb"><span style="width:96px">Bab ${bi+1}</span><div class="bar"><i style="width:${pc}%"></i></div><em>${r}/${ix.length}</em></div>`}).join('');
const msg=p>=80?'Luar biasa! 🎉':p>=60?'Bagus, terus berlatih 💪':'Ayo pelajari lagi materinya 📚';
app.innerHTML=`<div class="wrap in"><h1>Hasil Ujian</h1><div class="ring" style="--p:${p}"><span>${p}</span></div>
<p style="text-align:center;margin:0"><b>${msg}</b><br><span class="mu">${c} benar dari ${Q.length} soal · sisa waktu ${fm(Math.max(T,0))}</span></p>
<h2>Per bab</h2>${bb}<h2>Pembahasan</h2>
${Q.map((q,k)=>`<details><summary class="${res[k]?'ok':'no'}">${res[k]?'✓':'✗'} Soal ${k+1} · Bab ${q.b+1} <span class="mu" style="font-weight:400">(${q.l.split(' · ')[0]})</span></summary><div><p class="st">${esc(q.q)}</p><div class="ans ${res[k]?'g':'r'}"><b>Jawabanmu:</b><br>${fa(q,A[k])}</div>${res[k]?'':`<div class="ans g"><b>Kunci:</b><br>${fa(q,q.a)}</div>`}${q.e?`<p class="mu">💡 ${esc(q.e)}</p>`:''}</div></details>`).join('')}
<button class="btn pri full" onclick="start(${Q.length==25?'':Q[0].b})">Ulangi ujian ini</button><button class="btn full" onclick="home()">Kembali ke beranda</button></div>`;scrollTo({top:0})}
home();
</script></body></html>
